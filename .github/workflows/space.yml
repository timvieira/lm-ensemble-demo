name: Deploy the Hugging Face Space

# Uploads space/ to the Space xtimv/lm-ensemble-demo whenever space/ changes on main (or by hand, from the Actions tab).
# Needs the repository secret HF_TOKEN: a Hugging Face token that can write to that Space.
# Files deleted from space/ are not deleted on the Space.
on:
  push:
    branches: [main]
    paths: ['space/**', 'tests/test_proposal.py', 'tests/test_sampler_toy.py', '.github/workflows/space.yml']
  workflow_dispatch:

concurrency:
  group: space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The Space's code compiles
        run: python -m py_compile space/app.py space/ensemble_lib.py
      - name: The proposal against its definition (a toy model; CPU torch)
        run: |
          pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python tests/test_proposal.py
          python tests/test_sampler_toy.py
      - run: pip install "huggingface_hub>=1.0"
      - name: Upload space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::The repository secret HF_TOKEN is not set: a Hugging Face token that can write to xtimv/lm-ensemble-demo."; exit 1; }
          hf upload xtimv/lm-ensemble-demo space . --repo-type space --commit-message "Deploy from timvieira/lm-ensemble-demo@${GITHUB_SHA::8}"
